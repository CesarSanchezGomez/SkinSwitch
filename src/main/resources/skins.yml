# SwitchSkin skins. Each id maps to the look applied while its slot is active.
# Flat form (model only):  summer_skin: edosummer:ice_cream_pickaxe
# Section form: any subset of the fields below. name/lore are MiniMessage and
# support PlaceholderAPI (<player>, %player_name%, ...); the rest are vanilla.
#   item-model            model swap while active
#   name / lore           custom-name / lore while active
#   custom-model-data     floats / flags / strings / colors
#   tooltip-display       hide-tooltip / hidden-components
#   tooltip-style         applied only via the tooltip token
#   icon-active/-inactive slot-row glyph (falls back to default-icon-*)
#   bracket-color-*       MiniMessage colour tag like '<gray>' or '<#FCBDE3>'
#   token-skin/-tooltip   per-skin token overrides (item-model, custom-model-data)
#   applies-to            material/#tag whitelist; empty = any item
# Originals are captured on the first slot and restored when the last is removed.

# Slot-row fallbacks used when a skin omits its own override.
default-bracket-color-active: '<gray>'
default-bracket-color-inactive: '<dark_gray>'
default-icon-active: '●'
default-icon-inactive: '○'

skins:
  summer_skin:
    item-model: edosummer:ice_cream_pickaxe
    name: '<#FCBDE3>Summer Pickaxe</#FCBDE3>'
    icon-active: '🍦'
    bracket-color-active: '<#FCBDE3>'

  autum_skin:
    item-model: edoween:bone_set/bone_pickaxe
    name: '<white>🎃</white> <gradient:#FFFFFF:#BDBDBD>MegaPico de hueso</gradient> <white>🎃</white>'
    lore:
      - ''
      - ' <white>[</white> <#FFFFFF>⊰ <#F4F4F4>🦴 <#E9E9E9>⊱ <white>] Conseguido en #R.I.P. [</white> <#DEDEDE>⊰ <#D3D3D3>🦴 <#C8C8C8>⊱ <white>]</white> '
      - ''
      - ' <gradient:#FFFFFF:#BDBDBD><b>-= EDOXMAS =-</b></gradient> <gray>Propietari@</gray><white>:</white> <gradient:#FFFFFF:#BDBDBD>%player_name%</gradient><white>.</white> '
      - ''
    icon-active: ' <gradient:#FFFFFF:#BDBDBD>⊰ 🎃 ⊱</gradient> '
    icon-inactive: ' <white>⊰ 🎃 ⊱</white> '
    bracket-color-active: '<#414345>'
    tooltip-style: 'minecraft:white'

  winter_skin:
    item-model: edoxmas:glacial_set/glacial_pickaxe
    name: '<white>❊</white> <gradient:#A6F6FF:#0ED2F7>MegaPico glacial</gradient> <white>❊</white>'
    lore:
      - ''
      - ' <white>[</white> <#A6F6FF>⊰ <#88EFFD>⛄ <#69E8FC>⊱ <white>] Conseguido en #Un''ED''neathTheTree [</white> <#4BE0FA>⊰ <#2CD9F9>⛄ <#0ED2F7>⊱ <white>]</white> '
      - ''
      - ' <gradient:#A6F6FF:#0ED2F7><b>-= EDOXMAS =-</b></gradient> <gray>Propietari@</gray><white>:</white> <gradient:#A6F6FF:#0ED2F7>%player_name%</gradient><white>.</white> '
      - ''
    icon-active: ' <gradient:#A6F6FF:#0ED2F7>⊰ ❊ ⊱</gradient> '
    icon-inactive: ' <white>⊰ ❊ ⊱</white> '
    bracket-color-active: '<#0ED2F7>'
    tooltip-style: 'minecraft:aqua'
    tooltip-display:
      hidden-components:
        - 'attribute_modifiers'
    custom-model-data:
      strings:
        - 'glacial'
    applies-to:
      - '#minecraft:pickaxes'
